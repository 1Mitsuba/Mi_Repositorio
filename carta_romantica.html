<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta Romántica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-decor">
        <div class="decor-element flower"></div>
        <div class="decor-element flower"></div>
        <div class="decor-element flower"></div>
        <div class="decor-element flower"></div>
        <div class="decor-element heart"></div>
        <div class="decor-element heart"></div>
        <div class="decor-element heart"></div>
        <div class="decor-element heart"></div>
    </div>

    <div class="envelope" onclick="toggleEnvelope()">
        <div class="flap">
            <div class="heart">❤️</div>
        </div>
        <div class="body">
            <div class="decor-stripes"></div>
        </div>
        <div class="letter">
            <div class="letter-background">💌</div>
            <p>Querido/a,</p>
            <p>Eres la razón de mi sonrisa cada día. Tu amor ilumina mi vida y me llena de felicidad.</p>
            <p>Con todo mi amor,</p>
            <p class="signature">[Tu Nombre]</p>
            <div class="heart-decor">❤️❤️❤️</div>
            <div class="flower-decor">🌸🌸🌸</div>
        </div>
    </div>

    <!-- Decorative elements -->
    <div class="rising-element star">⭐</div>
    <div class="rising-element heart">❤️</div>
    <div class="rising-element star">⭐</div>
    <div class="rising-element heart">❤️</div>
    <div class="rising-element flower">🌸</div>
    <div class="rising-element flower">🌸</div>
    <div class="rising-element heart">❤️</div>
    <div class="rising-element star">⭐</div>

    <!-- Additional decorative elements -->
    <div class="candle"></div>
    <div class="candle"></div>
    <div class="candle"></div>
    <div class="candle"></div>

    <!-- New romantic elements -->
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <div class="ribbon"></div>
    <div class="ribbon"></div>

    <script src="script.js"></script>
</body>
</html>
